<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zhicong Sun · Gallery</title>
<link rel="shortcut icon" href="favicon.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000;
    color: #e5e5e5;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  /* Nav */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 100%);
    pointer-events: none;
  }
  nav span {
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.75);
    font-weight: 400;
  }

  /* Grid */
  .grid {
    columns: 3;
    column-gap: 3px;
    padding: 3px;
  }
  @media (max-width: 640px) {
    .grid { columns: 2; }
  }

  .photo-item {
    break-inside: avoid;
    margin-bottom: 3px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .photo-item img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity .6s ease, transform .4s ease;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }
  .photo-item img.loaded { opacity: 1; }
  .photo-item:hover img { transform: scale(1.02); }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.96);
    align-items: center;
    justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #lightbox img.ready { opacity: 1; }

  #lb-close {
    position: fixed;
    top: 20px; right: 24px;
    font-size: 22px;
    color: rgba(255,255,255,.6);
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
    transition: color .15s;
  }
  #lb-close:hover { color: #fff; }

  #lb-prev, #lb-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    color: rgba(255,255,255,.4);
    cursor: pointer;
    background: none;
    border: none;
    padding: 16px;
    transition: color .15s;
  }
  #lb-prev:hover, #lb-next:hover { color: #fff; }
  #lb-prev { left: 8px; }
  #lb-next { right: 8px; }

  #lb-counter {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: .1em;
    color: rgba(255,255,255,.35);
  }

  /* Signature */
  .signature {
    text-align: center;
    padding: 32px 0 24px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.18);
  }
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="aad048f5-3fca-4b7e-951e-85947610839e"></script>
</head>
<body>

<nav>
  <span>zhicong sun</span>
  <span>gallery</span>
</nav>

<div class="grid" id="gallery-grid"></div>

<div class="signature">© zhicong sun</div>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close">&#215;</button>
  <button id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="" />
  <button id="lb-next">&#8250;</button>
  <div id="lb-counter"></div>
</div>

<script>
  // Disable right-click on photos and lightbox
  document.getElementById('gallery-grid').addEventListener('contextmenu', e => e.preventDefault());
  document.getElementById('lightbox').addEventListener('contextmenu', e => e.preventDefault());

  // --- Photo loading: GitHub API → manifest.json fallback ---
  async function loadFilenames() {
    try {
      const res = await fetch('https://api.github.com/repos/zhicongsun/zhicongsun.github.io/contents/gallery');
      if (!res.ok) throw new Error('api failed');
      const data = await res.json();
      return data
        .filter(f => f.type === 'file' && /\.(jpg|jpeg|png|webp)$/i.test(f.name))
        .map(f => f.name)
        .sort();
    } catch (_) {}

    try {
      const res = await fetch('gallery/manifest.json');
      if (!res.ok) throw new Error('manifest failed');
      return await res.json();
    } catch (_) {}

    return [];
  }

  // --- Watermark ---
  function renderWithWatermark(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const size = Math.round(img.naturalWidth * 0.032);
    ctx.font = `300 ${size}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    const padding = Math.round(img.naturalWidth * 0.03);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 3;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillText('© zhicong sun', img.naturalWidth - padding, img.naturalHeight - padding);
    return canvas.toDataURL('image/jpeg', 0.92);
  }

  // --- Render grid ---
  const renderedUrls = [];
  const grid = document.getElementById('gallery-grid');

  async function renderPhotos(filenames) {
    // Load all images in parallel, insert DOM only once all are ready
    const items = await Promise.all(filenames.map((name, i) =>
      new Promise(resolve => {
        const item = document.createElement('div');
        item.className = 'photo-item';
        item.dataset.index = i;

        const img = document.createElement('img');
        img.alt = '';

        const finish = () => {
          try {
            renderedUrls[i] = renderWithWatermark(img);
            img.src = renderedUrls[i];
          } catch (_) {
            renderedUrls[i] = img.src;
          }
          img.classList.add('loaded');
          item.appendChild(img);
          item.addEventListener('click', () => openLightbox(i));
          resolve(item);
        };

        img.addEventListener('load', finish, { once: true });
        img.addEventListener('error', () => { renderedUrls[i] = img.src; img.classList.add('loaded'); item.appendChild(img); item.addEventListener('click', () => openLightbox(i)); resolve(item); }, { once: true });
        img.src = 'gallery/' + name;
      })
    ));

    items.forEach(item => grid.appendChild(item));
  }

  loadFilenames().then(renderPhotos);

  // --- Lightbox ---
  let current = 0;
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCounter = document.getElementById('lb-counter');

  function openLightbox(index) {
    current = index;
    lbImg.classList.remove('ready');
    lbImg.src = renderedUrls[current] || '';
    lbCounter.textContent = (current + 1) + ' / ' + renderedUrls.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbImg.onload = () => lbImg.classList.add('ready');
    if (lbImg.complete) lbImg.classList.add('ready');
  }

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  function navigate(dir) {
    current = (current + dir + renderedUrls.length) % renderedUrls.length;
    lbImg.classList.remove('ready');
    lbImg.src = renderedUrls[current];
    lbCounter.textContent = (current + 1) + ' / ' + renderedUrls.length;
    lbImg.onload = () => lbImg.classList.add('ready');
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); navigate(-1); });
  document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); navigate(1); });
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });
</script>

</body>
</html>
