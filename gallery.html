<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zhicong Sun · Gallery</title>
<link rel="shortcut icon" href="favicon.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000;
    color: #e5e5e5;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  /* Nav */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 100%);
    pointer-events: none;
  }
  nav span {
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.75);
    font-weight: 400;
  }

  /* Pinned grid — row-major (left→right, then next row) */
  #pinned-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 3px 3px 0 3px;
  }
  @media (max-width: 640px) {
    #pinned-grid { grid-template-columns: repeat(2, 1fr); }
  }
  #pinned-grid .photo-item {
    margin-bottom: 0;
    aspect-ratio: 2 / 3;
  }
  #pinned-grid .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Masonry grid — column-major */
  #gallery-grid {
    columns: 3;
    column-gap: 3px;
    padding: 3px;
  }
  @media (max-width: 640px) {
    #gallery-grid { columns: 2; }
  }
  #gallery-grid .photo-item {
    break-inside: avoid;
    margin-bottom: 3px;
  }

  /* Shared photo-item styles */
  .photo-item {
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .photo-item img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity .6s ease, transform .4s ease;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }
  .photo-item img.loaded { opacity: 1; }
  .photo-item:hover img { transform: scale(1.02); }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.96);
    align-items: center;
    justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #lightbox img.ready { opacity: 1; }

  #lb-close {
    position: fixed;
    top: 20px; right: 24px;
    font-size: 22px;
    color: rgba(255,255,255,.6);
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
    transition: color .15s;
  }
  #lb-close:hover { color: #fff; }

  #lb-prev, #lb-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    color: rgba(255,255,255,.4);
    cursor: pointer;
    background: none;
    border: none;
    padding: 16px;
    transition: color .15s;
  }
  #lb-prev:hover, #lb-next:hover { color: #fff; }
  #lb-prev { left: 8px; }
  #lb-next { right: 8px; }

  #lb-counter {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: .1em;
    color: rgba(255,255,255,.35);
  }

  /* Signature */
  .signature {
    text-align: center;
    padding: 32px 0 24px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.18);
  }
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="aad048f5-3fca-4b7e-951e-85947610839e"></script>
</head>
<body>

<nav>
  <span>zhicong sun</span>
  <span>gallery</span>
</nav>

<!-- Pinned photos: row-major grid -->
<div id="pinned-grid"></div>

<!-- Rest: masonry columns -->
<div id="gallery-grid"></div>

<div class="signature">© zhicong sun</div>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close">&#215;</button>
  <button id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="" />
  <button id="lb-next">&#8250;</button>
  <div id="lb-counter"></div>
</div>

<script>
  // Disable right-click
  ['pinned-grid','gallery-grid','lightbox'].forEach(id =>
    document.getElementById(id).addEventListener('contextmenu', e => e.preventDefault())
  );

  // --- Load pinned list + full manifest ---
  async function loadData() {
    let pinnedNames = [];
    try {
      const res = await fetch('gallery/pinned.json');
      if (res.ok) pinnedNames = await res.json();
    } catch (_) {}

    let allFiles = [];
    try {
      const res = await fetch('gallery/manifest.json');
      if (!res.ok) throw new Error();
      allFiles = await res.json();
    } catch (_) {
      try {
        const res = await fetch('https://api.github.com/repos/zhicongsun/zhicongsun.github.io/contents/gallery');
        if (!res.ok) throw new Error();
        const data = await res.json();
        allFiles = data
          .filter(f => f.type === 'file' && /\.(jpg|jpeg|png|webp)$/i.test(f.name))
          .map(f => f.name).sort();
      } catch (_) {}
    }

    const pinnedSet = new Set(pinnedNames.map(p => p.toLowerCase()));
    return {
      pinned: allFiles.filter(f => pinnedSet.has(f.toLowerCase())),
      rest:   allFiles.filter(f => !pinnedSet.has(f.toLowerCase()))
    };
  }

  // --- Watermark ---
  function renderWithWatermark(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const size = Math.round(img.naturalWidth * 0.032);
    ctx.font = `300 ${size}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    const padding = Math.round(img.naturalWidth * 0.03);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 3;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillText('© zhicong sun', img.naturalWidth - padding, img.naturalHeight - padding);
    return canvas.toDataURL('image/jpeg', 0.92);
  }

  // --- Shared state ---
  const renderedUrls = [];
  const pinnedGrid = document.getElementById('pinned-grid');
  const galleryGrid = document.getElementById('gallery-grid');

  function createItem(name, index) {
    return new Promise(resolve => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.dataset.index = index;

      const img = document.createElement('img');
      img.alt = '';

      const finish = () => {
        try {
          renderedUrls[index] = renderWithWatermark(img);
          img.src = renderedUrls[index];
        } catch (_) {
          renderedUrls[index] = img.src;
        }
        img.classList.add('loaded');
        item.appendChild(img);
        item.addEventListener('click', () => openLightbox(index));
        resolve(item);
      };

      img.addEventListener('load', finish, { once: true });
      img.addEventListener('error', () => {
        renderedUrls[index] = img.src;
        img.classList.add('loaded');
        item.appendChild(img);
        item.addEventListener('click', () => openLightbox(index));
        resolve(item);
      }, { once: true });
      img.src = 'gallery/' + name;
    });
  }

  async function renderPhotos({ pinned, rest }) {
    // Pad pinned to fill complete rows (3 cols desktop / 2 cols mobile → lcm=6, simpler: next multiple of 3)
    const COLS = 3;
    const rem = pinned.length % COLS;
    const padding = rem === 0 ? 0 : COLS - rem;
    const paddedPinned = pinned.concat(rest.slice(0, padding));
    const trimmedRest = rest.slice(padding);
    const pinnedCount = paddedPinned.length;

    const pinnedPromise = Promise.all(paddedPinned.map((name, i) => createItem(name, i)));

    // Kick off rest loading in background; insert each item as it resolves
    trimmedRest.forEach((name, i) => {
      createItem(name, pinnedCount + i).then(item => galleryGrid.appendChild(item));
    });

    const pinnedItems = await pinnedPromise;
    pinnedItems.forEach(item => pinnedGrid.appendChild(item));
  }

  loadData().then(renderPhotos);

  // --- Lightbox ---
  let current = 0;
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCounter = document.getElementById('lb-counter');

  function openLightbox(index) {
    current = index;
    lbImg.classList.remove('ready');
    lbImg.src = renderedUrls[current] || '';
    lbCounter.textContent = (current + 1) + ' / ' + renderedUrls.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbImg.onload = () => lbImg.classList.add('ready');
    if (lbImg.complete) lbImg.classList.add('ready');
  }

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  function navigate(dir) {
    current = (current + dir + renderedUrls.length) % renderedUrls.length;
    lbImg.classList.remove('ready');
    lbImg.src = renderedUrls[current];
    lbCounter.textContent = (current + 1) + ' / ' + renderedUrls.length;
    lbImg.onload = () => lbImg.classList.add('ready');
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); navigate(-1); });
  document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); navigate(1); });
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  // Touch swipe
  let touchStartX = 0, touchStartY = 0;
  lb.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      navigate(dx < 0 ? 1 : -1);
    } else if (dy > 60 && Math.abs(dx) < 60) {
      closeLightbox();
    }
  }, { passive: true });
</script>

</body>
</html>
