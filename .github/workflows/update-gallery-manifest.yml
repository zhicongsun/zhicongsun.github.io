name: Update gallery manifest

on:
  push:
    branches: [main]
    paths: ['gallery/**']

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 - <<'EOF'
          import os, json
          exts = ('.jpg', '.jpeg', '.png', '.webp')
          files = sorted([
            f for f in os.listdir('gallery')
            if f.lower().endswith(exts)
          ])
          with open('gallery/manifest.json', 'w') as fp:
            json.dump(files, fp, indent=2)
            fp.write('\n')
          print(f"Wrote {len(files)} files to gallery/manifest.json")
          EOF

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery/manifest.json
          git diff --staged --quiet || git commit -m "chore: update gallery manifest"
          git push
